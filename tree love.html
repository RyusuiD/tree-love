<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I Love You</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--top:#1b1033;--bot:#5a1f4a;--pink:#ff4d8d;--soft:#ffd1e3;--text:#fff4f8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--top) 0%,#3a1747 55%,var(--bot) 100%);color:var(--text);font-family:Nunito,system-ui,sans-serif;overflow:hidden;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%}
.ui{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:6vh 16px 0;text-align:center;pointer-events:none}
h1{font-family:'Dancing Script',cursive;font-weight:600;font-size:clamp(3rem,11vw,6.5rem);margin:0;line-height:1;color:var(--soft);text-shadow:0 0 24px rgba(255,77,141,.7),0 0 60px rgba(255,77,141,.35);min-height:1.1em}
h1 .cur{display:inline-block;width:3px;height:.8em;background:var(--soft);margin-left:4px;vertical-align:middle;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
p{margin:.8rem 0 0;font-size:clamp(1rem,3.4vw,1.25rem);opacity:.9;min-height:1.6em}
.name{position:absolute;z-index:3;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;width:min(92vw,360px)}
.name input{flex:1;min-width:0;padding:10px 14px;border-radius:99px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:var(--text);font:inherit;outline:none}
.name input:focus-visible,.name button:focus-visible{outline:2px solid var(--soft);outline-offset:2px}
.name input::placeholder{color:rgba(255,244,248,.65)}
.name button{padding:10px 18px;border:0;border-radius:99px;background:var(--pink);color:#fff;font:700 1rem Nunito,sans-serif;cursor:pointer}
@media (prefers-reduced-motion:reduce){h1 .cur{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="ui">
  <h1 id="t" aria-live="polite"></h1>
  <p id="s"></p>
</div>
<script>
(function(){
var cv=document.getElementById('c'),x=cv.getContext('2d'),W,H,D,stars=[],hearts=[],fall=[],trunk=[],t0=0;
var cols=['#ff4d8d','#ff7aa8','#ff2e6e','#ffa0c0','#e6155a'];
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function heart(c,px,py,s,col,a){c.save();c.translate(px,py);c.scale(s,s);c.globalAlpha=a;c.fillStyle=col;c.beginPath();
c.moveTo(0,.35);c.bezierCurveTo(-1,-.35,-.55,-1,0,-.45);c.bezierCurveTo(.55,-1,1,-.35,0,.35);c.fill();c.restore()}
function build(){
 D=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);
 stars=[];for(var i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.7,r:Math.random()*1.4+.3,p:Math.random()*6});
 var cx=W/2,base=H-Math.min(70,H*.1),sc=Math.min(W,H*.9)/38;
 // canopy hearts inside big heart shape
 hearts=[];var n=520;
 for(var i=0;i<n;i++){
  var a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random());
  var hx=16*Math.pow(Math.sin(a),3)*r,hy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*r;
  hearts.push({x:cx+hx*sc*.95,y:base-sc*22+hy*sc*.95-sc*3,s:sc*(.5+Math.random()*.7),c:cols[i%cols.length],d:i/n*3.2+1.2,rot:0});
 }
 hearts.sort(function(a,b){return a.d-b.d});
 // trunk: curved path with two branches
 var th=sc*17;trunk=[
  {p:[[cx,base],[cx-sc*.8,base-th*.4],[cx+sc*.6,base-th*.7],[cx,base-th]],w:sc*1.5,d:0,l:1.2},
  {p:[[cx,base-th*.45],[cx-sc*2,base-th*.6],[cx-sc*4,base-th*.75],[cx-sc*6,base-th*.95]],w:sc*.7,d:.7,l:.8},
  {p:[[cx,base-th*.6],[cx+sc*2,base-th*.72],[cx+sc*4,base-th*.85],[cx+sc*6.5,base-th*1.05]],w:sc*.7,d:.9,l:.8}
 ];
 base_=base;sc_=sc;
}
var base_,sc_;
function bez(p,u){var m=1-u;return[m*m*m*p[0][0]+3*m*m*u*p[1][0]+3*m*u*u*p[2][0]+u*u*u*p[3][0],m*m*m*p[0][1]+3*m*m*u*p[1][1]+3*m*u*u*p[2][1]+u*u*u*p[3][1]]}
function frame(ts){
 if(!t0)t0=ts;var t=reduce?99:(ts-t0)/1000;
 x.clearRect(0,0,W,H);
 stars.forEach(function(s){x.globalAlpha=.4+.6*Math.abs(Math.sin(ts/900+s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});
 x.globalAlpha=1;
 // ground glow
 var g=x.createRadialGradient(W/2,base_+8,5,W/2,base_+8,sc_*14);g.addColorStop(0,'rgba(255,77,141,.35)');g.addColorStop(1,'rgba(255,77,141,0)');
 x.fillStyle=g;x.fillRect(0,base_-sc_*6,W,sc_*20);
 // trunk
 x.lineCap='round';x.strokeStyle='#5b3425';
 trunk.forEach(function(b){
  var k=Math.max(0,Math.min(1,(t-b.d)/b.l));if(!k)return;
  for(var i=0;i<k*40;i++){var u=i/40,q=bez(b.p,u);x.lineWidth=b.w*(1-u*.65);x.beginPath();var q2=bez(b.p,(i+1)/40);x.moveTo(q[0],q[1]);x.lineTo(q2[0],q2[1]);x.stroke()}
 });
 // canopy
 hearts.forEach(function(h){
  var k=Math.max(0,Math.min(1,(t-h.d)/.8));if(!k)return;
  var sway=Math.sin(ts/1200+h.x*.02)*1.2;
  heart(x,h.x+sway,h.y,h.s*(0.2+.8*k)*(1+.05*Math.sin(ts/500+h.d)),h.c,k)
 });
 // falling hearts
 if(t>4.5&&Math.random()<.12)fall.push({x:W/2+(Math.random()-.5)*sc_*26,y:base_-sc_*30+Math.random()*sc_*14,v:.4+Math.random()*.7,s:sc_*(.4+Math.random()*.4),c:cols[Math.random()*5|0],p:Math.random()*6,a:1});
 fall=fall.filter(function(f){f.y+=f.v;f.x+=Math.sin(ts/600+f.p)*.5;if(f.y>base_+6){f.a-=.04}return f.a>0});
 fall.forEach(function(f){heart(x,f.x,f.y,f.s,f.c,Math.max(f.a,0))});
 requestAnimationFrame(frame);
}
// typing text
var tEl=document.getElementById('t'),sEl=document.getElementById('s'),typing=0;
function type(txt,sub){
 var id=++typing,i=0;sEl.textContent='';
 tEl.innerHTML='<span class="cur"></span>';
 (function step(){if(id!==typing)return;i++;tEl.innerHTML='';tEl.appendChild(document.createTextNode(txt.slice(0,i)));
  var c=document.createElement('span');c.className='cur';tEl.appendChild(c);
  if(i<txt.length||reduce&&i<txt.length)setTimeout(step,reduce?0:130);else sEl.textContent=sub}())
}
addEventListener('resize',function(){build()});
build();requestAnimationFrame(frame);
setTimeout(function(){type('I Love You','Hai ntik! aku hanya iseng hehe, Semoga suka ya cintaku.')},500);
})();
</script>
</body>
</html>
